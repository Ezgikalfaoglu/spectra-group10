<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Fingerprint specimen — latent impression, whorl pattern.

    WHY LOSSLESS IS MANDATORY:
    JPEG compresses in 8×8 pixel blocks. Fingerprint ridges are ~10px apart.
    At Δ > 8, DCT quantisation merges adjacent ridges and creates false
    ridge endings — destroying the minutiae (bifurcations + endings) that
    forensic matching depends on. Even a single false minutia can cause a
    false non-match in AFIS systems. Hence: Δ = 1, lossless-forced.
  -->

  <!-- Scan background — slightly warm off-white like ink on card -->
  <rect width="512" height="512" fill="#f2efe8"/>

  <!-- Ink stain halo — simulates latent print deposit -->
  <ellipse cx="256" cy="256" rx="230" ry="218" fill="#e8e0d0" opacity="0.6"/>
  <ellipse cx="256" cy="256" rx="210" ry="198" fill="#ddd5c2" opacity="0.4"/>

  <!-- Whorl ridge pattern — 30 concentric ellipses, centre at (256,254) -->
  <!-- Ridge spacing: ~9px. ry ≈ rx × 0.88 for a slightly oval whorl -->
  <g fill="none" stroke="#2a1f0e" stroke-width="2.2" stroke-linecap="round">
    <ellipse cx="256" cy="254" rx="5"   ry="4"/>
    <ellipse cx="256" cy="254" rx="14"  ry="12"/>
    <ellipse cx="256" cy="254" rx="23"  ry="20"/>
    <ellipse cx="256" cy="254" rx="32"  ry="28"/>
    <ellipse cx="256" cy="254" rx="41"  ry="36"/>
    <ellipse cx="256" cy="254" rx="50"  ry="44"/>
    <ellipse cx="256" cy="254" rx="59"  ry="52"/>
    <ellipse cx="256" cy="254" rx="68"  ry="60"/>
    <ellipse cx="256" cy="254" rx="77"  ry="68"/>
    <ellipse cx="256" cy="254" rx="86"  ry="76"/>
    <ellipse cx="256" cy="254" rx="95"  ry="84"/>
    <ellipse cx="256" cy="254" rx="104" ry="92"/>
    <ellipse cx="256" cy="254" rx="113" ry="100"/>
    <ellipse cx="256" cy="254" rx="122" ry="108"/>
    <ellipse cx="256" cy="254" rx="131" ry="116"/>
    <ellipse cx="256" cy="254" rx="140" ry="124"/>
    <ellipse cx="256" cy="254" rx="149" ry="132"/>
    <ellipse cx="256" cy="254" rx="158" ry="140"/>
    <ellipse cx="256" cy="254" rx="167" ry="148"/>
    <ellipse cx="256" cy="254" rx="176" ry="156"/>
    <ellipse cx="256" cy="254" rx="185" ry="165"/>
    <ellipse cx="256" cy="254" rx="194" ry="174"/>
    <ellipse cx="256" cy="254" rx="203" ry="183"/>
    <ellipse cx="256" cy="254" rx="212" ry="192"/>
    <ellipse cx="256" cy="254" rx="221" ry="201"/>
    <ellipse cx="256" cy="254" rx="230" ry="210"/>
    <ellipse cx="256" cy="254" rx="239" ry="219"/>
    <ellipse cx="256" cy="254" rx="248" ry="228"/>
    <ellipse cx="256" cy="254" rx="258" ry="238"/>
    <ellipse cx="256" cy="254" rx="268" ry="248"/>
  </g>

  <!-- Delta region — lower left (whorl has 2 deltas; this is one) -->
  <!-- Delta = triangular divergence where ridges split into two flow directions -->
  <g fill="none" stroke="#2a1f0e" stroke-width="1.8" opacity="0.75">
    <path d="M100,360 C88,348 85,330 94,312"/>
    <path d="M105,365 C95,350 93,330 104,310"/>
    <path d="M110,368 C102,352 101,332 112,312"/>
    <path d="M92,358 C80,343 78,322 89,304"/>
    <path d="M118,366 C111,350 110,330 122,310"/>
  </g>

  <!-- Delta region — lower right -->
  <g fill="none" stroke="#2a1f0e" stroke-width="1.8" opacity="0.75">
    <path d="M412,360 C424,348 427,330 418,312"/>
    <path d="M407,365 C417,350 419,330 408,310"/>
    <path d="M402,368 C410,352 411,332 400,312"/>
    <path d="M420,358 C432,343 434,322 423,304"/>
    <path d="M394,366 C401,350 402,330 390,310"/>
  </g>

  <!-- Minutiae markers — forensic feature points -->
  <!-- Red: ridge endings. Blue: bifurcations -->
  <g fill="none" stroke-width="1.4">
    <!-- Ridge endings (terminus) -->
    <circle cx="216" cy="186" r="5" stroke="#c0392b"/>
    <circle cx="302" cy="178" r="5" stroke="#c0392b"/>
    <circle cx="174" cy="250" r="5" stroke="#c0392b"/>
    <circle cx="338" cy="260" r="5" stroke="#c0392b"/>
    <circle cx="206" cy="322" r="5" stroke="#c0392b"/>
    <circle cx="306" cy="328" r="5" stroke="#c0392b"/>
    <circle cx="256" cy="170" r="5" stroke="#c0392b"/>
    <circle cx="256" cy="338" r="5" stroke="#c0392b"/>
    <!-- Bifurcations (Y-split) -->
    <path d="M190,214 L196,208 M190,214 L196,220" stroke="#1a6fd4" stroke-width="2"/>
    <path d="M322,214 L316,208 M322,214 L316,220" stroke="#1a6fd4" stroke-width="2"/>
    <path d="M188,296 L194,290 M188,296 L194,302" stroke="#1a6fd4" stroke-width="2"/>
    <path d="M324,296 L318,290 M324,296 L318,302" stroke="#1a6fd4" stroke-width="2"/>
    <path d="M228,148 L234,142 M228,148 L234,154" stroke="#1a6fd4" stroke-width="2"/>
    <path d="M284,148 L278,142 M284,148 L278,154" stroke="#1a6fd4" stroke-width="2"/>
  </g>

  <!-- Legend — bottom -->
  <rect x="32" y="468" width="448" height="34" rx="4" fill="white" opacity="0.88" stroke="#c8c0b0" stroke-width="1"/>
  <g font-family="monospace" font-size="9" fill="#333">
    <circle cx="52"  cy="485" r="5" fill="none" stroke="#c0392b" stroke-width="1.4"/>
    <text x="62"  y="489">Ridge ending</text>
    <line x1="160" y1="481" x2="166" y2="475" stroke="#1a6fd4" stroke-width="2"/>
    <line x1="160" y1="481" x2="166" y2="487" stroke="#1a6fd4" stroke-width="2"/>
    <text x="172" y="489">Bifurcation</text>
    <text x="268" y="489">|  LOSSLESS MANDATORY — Δ=1</text>
    <text x="268" y="499" font-size="8" fill="#888">JPEG Δ&gt;8 merges ridges → false minutiae</text>
  </g>

  <!-- Border scan frame -->
  <rect x="8" y="8" width="496" height="496" rx="6" fill="none"
        stroke="#b0a898" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="256" y="26" font-family="monospace" font-size="9" fill="#888"
        text-anchor="middle" letter-spacing="2">LATENT SCAN · WHORL TYPE · FORENSIC GRADE</text>
</svg>
