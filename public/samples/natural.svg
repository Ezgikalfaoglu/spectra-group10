<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="nat-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="30%" stop-color="#4a80b8"/>
      <stop offset="65%" stop-color="#c0825a"/>
      <stop offset="100%" stop-color="#e8b860"/>
    </linearGradient>
    <linearGradient id="nat-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8d4e8"/>
      <stop offset="100%" stop-color="#1e3d5a"/>
    </linearGradient>
    <linearGradient id="nat-mtn-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a647a"/>
      <stop offset="100%" stop-color="#38404e"/>
    </linearGradient>
    <linearGradient id="nat-mtn-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#283040"/>
      <stop offset="100%" stop-color="#18202a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="512" height="345" fill="url(#nat-sky)"/>

  <!-- Stars — irregular spacing, natural -->
  <g fill="white">
    <circle cx="42"  cy="28"  r="1.1" opacity="0.75"/>
    <circle cx="118" cy="54"  r="0.9" opacity="0.60"/>
    <circle cx="203" cy="22"  r="1.3" opacity="0.80"/>
    <circle cx="317" cy="42"  r="0.8" opacity="0.55"/>
    <circle cx="428" cy="18"  r="1.2" opacity="0.70"/>
    <circle cx="477" cy="58"  r="1.0" opacity="0.65"/>
    <circle cx="79"  cy="82"  r="0.8" opacity="0.50"/>
    <circle cx="158" cy="67"  r="1.0" opacity="0.60"/>
    <circle cx="376" cy="72"  r="0.9" opacity="0.55"/>
    <circle cx="255" cy="45"  r="1.1" opacity="0.70"/>
    <circle cx="490" cy="90"  r="0.7" opacity="0.45"/>
    <circle cx="22"  cy="65"  r="0.9" opacity="0.60"/>
    <circle cx="355" cy="18"  r="1.0" opacity="0.65"/>
  </g>

  <!-- Sun near horizon — natural, slightly warm halo -->
  <circle cx="415" cy="238" r="30"  fill="#f5d060" opacity="0.12"/>
  <circle cx="415" cy="238" r="20"  fill="#f5c845" opacity="0.25"/>
  <circle cx="415" cy="238" r="14"  fill="#fad84a" opacity="0.92"/>

  <!-- Distant mountains — slightly irregular, organic silhouette -->
  <path d="M-8,298 L48,208 L82,226 L118,182 L158,210 L195,168 L232,202 L268,158 L305,194 L345,152 L383,188 L415,162 L452,192 L488,170 L520,178 L520,345 L-8,345 Z"
        fill="url(#nat-mtn-far)"/>

  <!-- Snow on distant peaks — natural, uneven -->
  <g fill="white" opacity="0.55">
    <path d="M118,182 L127,191 L138,188 L145,194 L138,202 L126,198 L118,182 Z"/>
    <path d="M268,158 L278,167 L289,163 L297,169 L288,178 L276,174 L268,158 Z"/>
    <path d="M345,152 L356,162 L367,157 L374,163 L365,173 L353,169 L345,152 Z"/>
  </g>

  <!-- Near mountain range — irregular, organic edges -->
  <path d="M-8,342 L55,250 L92,280 L140,222 L185,262 L225,215 L268,252 L308,205 L352,248 L395,218 L438,252 L480,228 L520,242 L520,400 L-8,400 Z"
        fill="url(#nat-mtn-near)"/>

  <!-- Near snow caps — natural patches -->
  <g fill="white" opacity="0.62">
    <path d="M140,222 L152,232 L162,228 L170,234 L160,244 L148,240 L140,222 Z"/>
    <path d="M225,215 L238,226 L248,221 L258,228 L248,238 L234,234 L225,215 Z"/>
    <path d="M308,205 L320,215 L330,210 L340,217 L330,228 L317,224 L308,205 Z"/>
    <path d="M395,218 L405,227 L413,223 L420,229 L413,238 L403,234 L395,218 Z"/>
  </g>

  <!-- Lake -->
  <rect x="0" y="370" width="512" height="142" fill="url(#nat-water)"/>

  <!-- Mountain reflection — subtle waviness -->
  <path d="M-8,395 L55,440 L92,415 L140,462 L185,428 L225,468 L268,434 L308,470 L352,440 L395,468 L438,442 L520,458 L520,512 L-8,512 Z"
        fill="#1a3048" opacity="0.50"/>

  <!-- Water ripples — slightly irregular -->
  <g stroke="#90b8d0" stroke-width="0.9" fill="none" opacity="0.38">
    <path d="M30,385  Q100,378 170,386 Q230,393 280,384"/>
    <path d="M150,408 Q218,400 288,409 Q348,416 408,408"/>
    <path d="M55,428  Q130,420 200,429 Q265,436 330,427"/>
    <path d="M210,450 Q275,442 345,451 Q410,458 470,450"/>
    <path d="M80,470  Q155,462 228,471 Q288,478 350,470"/>
  </g>

  <!-- Ground strip -->
  <rect x="0" y="395" width="512" height="8" fill="#122018" opacity="0.6"/>

  <!-- Forest left — irregular, organic tree silhouettes -->
  <g fill="#0e1f14">
    <path d="M-8,400 L8,368  L20,400 Z"/>
    <path d="M4,395  L18,358 L34,395 Z"/>
    <path d="M20,398 L36,362 L52,398 Z"/>
    <path d="M38,400 L52,372 L66,400 Z"/>
    <path d="M10,383 L26,345 L42,383 Z"/>
    <path d="M52,396 L64,370 L76,396 Z"/>
    <path d="M68,400 L78,375 L90,400 Z"/>
  </g>

  <!-- Forest right -->
  <g fill="#0e1f14">
    <path d="M420,400 L432,370 L444,400 Z"/>
    <path d="M435,396 L450,360 L464,396 Z"/>
    <path d="M452,400 L466,368 L480,400 Z"/>
    <path d="M468,395 L482,363 L496,395 Z"/>
    <path d="M484,400 L496,375 L510,400 Z"/>
    <path d="M500,398 L510,374 L520,398 Z"/>
  </g>

  <!-- Atmosphere haze — natural sky/land transition -->
  <rect x="0" y="330" width="512" height="42" fill="#c88050" opacity="0.10"/>
</svg>
