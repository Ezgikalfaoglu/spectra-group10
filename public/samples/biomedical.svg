<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Biomedical specimen — simulated brain MRI axial slice (T1-weighted).
    Grayscale: different tissue densities map to different gray values.
    · Skull:       bright (high signal)
    · White matter: medium-bright
    · Gray matter:  medium
    · CSF / ventricles: dark (low signal, like water)
    · Deep structures: medium-dark

    Lossless required: lossy compression at Δ > 8 can:
    · Blur tissue boundaries → misread lesion borders
    · Alter Hounsfield-equivalent values → wrong tissue classification
    · Compress ventricle CSF margins → missed hydrocephalus signs
  -->

  <!-- Black background — MRI displays on black -->
  <rect width="512" height="512" fill="#0a0a0a"/>

  <!-- Skull outer boundary — bright ring -->
  <circle cx="256" cy="256" r="220" fill="#d8d8d8"/>

  <!-- Skull inner — diploe (spongy bone, slightly darker) -->
  <circle cx="256" cy="256" r="205" fill="#888888"/>

  <!-- Meninges / CSF space — dark ring -->
  <circle cx="256" cy="256" r="196" fill="#1a1a1a"/>

  <!-- Brain surface — cortical gray matter -->
  <circle cx="256" cy="256" r="188" fill="#585858"/>

  <!-- White matter — larger, brighter -->
  <circle cx="256" cy="256" r="168" fill="#a0a0a0"/>

  <!-- Subcortical gray — basal ganglia region (bilateral) -->
  <ellipse cx="220" cy="256" rx="30" ry="38" fill="#606060"/>
  <ellipse cx="292" cy="256" rx="30" ry="38" fill="#606060"/>

  <!-- Internal capsule — bright white matter tracts -->
  <ellipse cx="236" cy="256" rx="10" ry="22" fill="#b8b8b8"/>
  <ellipse cx="276" cy="256" rx="10" ry="22" fill="#b8b8b8"/>

  <!-- Thalamus (bilateral) — medium gray -->
  <ellipse cx="226" cy="270" rx="18" ry="22" fill="#707070"/>
  <ellipse cx="286" cy="270" rx="18" ry="22" fill="#707070"/>

  <!-- Third ventricle — dark midline structure (CSF) -->
  <ellipse cx="256" cy="268" rx="5" ry="20" fill="#151515"/>

  <!-- Lateral ventricles — dark CSF cavities (bilateral, anterior + posterior horns) -->
  <!-- Anterior horns -->
  <ellipse cx="220" cy="230" rx="18" ry="12" fill="#111111"/>
  <ellipse cx="292" cy="230" rx="18" ry="12" fill="#111111"/>
  <!-- Body -->
  <ellipse cx="218" cy="248" rx="12" ry="16" fill="#111111"/>
  <ellipse cx="294" cy="248" rx="12" ry="16" fill="#111111"/>
  <!-- Posterior horns -->
  <ellipse cx="222" cy="298" rx="8"  ry="14" fill="#111111"/>
  <ellipse cx="290" cy="298" rx="8"  ry="14" fill="#111111"/>

  <!-- Corpus callosum — bright white band connecting hemispheres -->
  <ellipse cx="256" cy="222" rx="42" ry="8" fill="#c8c8c8"/>

  <!-- Brainstem — at bottom, medium signal -->
  <ellipse cx="256" cy="348" rx="28" ry="30" fill="#787878"/>

  <!-- Cerebellum — at back, finely folded (simplified as ellipse) -->
  <ellipse cx="256" cy="390" rx="72" ry="42" fill="#686868"/>
  <ellipse cx="256" cy="390" rx="60" ry="32" fill="#787878"/>
  <!-- Cerebellar folia hints -->
  <g stroke="#505050" stroke-width="1" fill="none">
    <path d="M196,385 Q256,375 316,385"/>
    <path d="M200,395 Q256,384 312,395"/>
    <path d="M204,405 Q256,393 308,405"/>
  </g>

  <!-- Sulci — cortical folds (lines on gray matter surface) -->
  <g stroke="#444444" stroke-width="1.5" fill="none">
    <path d="M100,190 Q130,175 160,188"/>
    <path d="M352,188 Q382,175 410,190"/>
    <path d="M88,256  Q80,230  90,200"/>
    <path d="M424,256 Q432,230 422,200"/>
    <path d="M112,322 Q130,340 155,330"/>
    <path d="M400,322 Q382,340 357,330"/>
    <path d="M162,148 Q185,138 210,148"/>
    <path d="M302,148 Q327,138 350,148"/>
    <path d="M126,168 Q148,155 170,164"/>
    <path d="M386,168 Q364,155 342,164"/>
  </g>

  <!-- Measurement scale bar — standard radiological practice -->
  <rect x="40" y="458" width="80" height="5" fill="white"/>
  <line x1="40" y1="453" x2="40"  y2="468" stroke="white" stroke-width="1.5"/>
  <line x1="120" y1="453" x2="120" y2="468" stroke="white" stroke-width="1.5"/>
  <text x="80" y="475" font-family="monospace" font-size="9" fill="white"
        text-anchor="middle">20 mm</text>

  <!-- Slice info — radiology header -->
  <text x="256" y="24"  font-family="monospace" font-size="9" fill="#cccccc"
        text-anchor="middle" letter-spacing="1.5">T1-WEIGHTED · AXIAL · z = +5mm</text>
  <text x="30"  y="40"  font-family="monospace" font-size="8" fill="#888">R</text>
  <text x="478" y="40"  font-family="monospace" font-size="8" fill="#888">L</text>
  <text x="256" y="500" font-family="monospace" font-size="8" fill="#555"
        text-anchor="middle">LOSSLESS REQUIRED — lossy Δ&gt;8 risks tissue misclassification</text>

  <!-- Windowing label -->
  <text x="30"  y="490" font-family="monospace" font-size="8" fill="#666">W:400 L:200</text>
</svg>
